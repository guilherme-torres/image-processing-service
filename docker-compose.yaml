services:
  backend:
    build: .
    entrypoint: ["tail", "-f", "/dev/null"] # uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload
    container_name: image_processing_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRATION_SECONDS=${JWT_ACCESS_EXPIRATION_SECONDS}
      - JWT_ACCESS_ALGORITHM=${JWT_ACCESS_ALGORITHM}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRATION_SECONDS=${JWT_REFRESH_EXPIRATION_SECONDS}
      - JWT_REFRESH_ALGORITHM=${JWT_REFRESH_ALGORITHM}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
    depends_on:
      - postgres
      - rabbitmq
      - redis
    volumes:
      - "./app:/code/app"
      - "./migrations:/code/migrations"
      - "./uploads:/code/uploads"
  
  celery_worker:
    build: .
    container_name: image_processing_worker
    command: ["celery", "-A", "app.core.celery", "worker", "--loglevel=info"]
    depends_on:
      - rabbitmq
      - backend
      - redis
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRATION_SECONDS=${JWT_ACCESS_EXPIRATION_SECONDS}
      - JWT_ACCESS_ALGORITHM=${JWT_ACCESS_ALGORITHM}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRATION_SECONDS=${JWT_REFRESH_EXPIRATION_SECONDS}
      - JWT_REFRESH_ALGORITHM=${JWT_REFRESH_ALGORITHM}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
    volumes:
      - "./app:/code/app"
      - "./uploads:/code/uploads"

  postgres:
    image: postgres:14
    container_name: image_processing_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: "redis:7-alpine"
    hostname: "redis"
    ports:
      - "6379:6379"
    restart: unless-stopped

  flower:
    image: mher/flower
    container_name: flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - FLOWER_BASIC_AUTH=admin:admin
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data: