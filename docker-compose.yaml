services:
  backend:
    build: .
    entrypoint: ["tail", "-f", "/dev/null"] # uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    container_name: image_processing_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    depends_on:
      - postgres
    volumes:
      - "./app:/code/app"
      - "./migrations:/code/migrations"

  postgres:
    image: postgres:14
    container_name: image_processing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: